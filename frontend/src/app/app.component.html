<header class="topbar">
  <a class="brand" href="/" aria-label="Trader's Gita home"><span class="brand-mark">T</span><span>TRADER'S <span class="brand-light">GITA</span></span></a>
  <div class="topbar-right">
    <span class="session-clock">{{ clock }}</span>
    <span class="connection-state" [class.connected]="connected"><i></i>{{ connected ? 'Upstox connected' : 'Upstox not connected' }}</span>
    <a class="connect-button" href="/auth/upstox" [hidden]="connected">Connect Upstox</a>
    <button class="disconnect-button" type="button" [hidden]="!connected" (click)="disconnect()">Disconnect</button>
  </div>
</header>

<main>
  <app-ema-scanner></app-ema-scanner>
</main>
