# Local PostgreSQL for Traders Gita (Mac, Windows, Linux)
# Add POSTGRES_PASSWORD and DATABASE_URL to your local .env file.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: traders_gita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traders_gita"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
